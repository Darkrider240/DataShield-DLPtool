

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: datashield
      POSTGRES_PASSWORD: datashield
      POSTGRES_DB: datashield
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datashield"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://datashield:datashield@postgres:5432/datashield
      MASTER_KEY_PASSPHRASE: ${MASTER_KEY_PASSPHRASE:-ChangeMe_Prod_Passphrase}
      MASTER_KEY_SALT_HEX: ${MASTER_KEY_SALT_HEX:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-ChangeMe_JWT_Secret}
      AGENT_API_KEY: ${AGENT_API_KEY:-ChangeMe_Agent_Key}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      ALERT_EMAIL_RECIPIENTS: ${ALERT_EMAIL_RECIPIENTS:-}
      DEBUG: "false"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./rules:/app/rules:ro

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  pg_data:
